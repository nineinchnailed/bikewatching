<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="global.css" />
    <link rel="stylesheet" href="map.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
    <script src="map.js" type="module"></script>
    <title>Bikewatching</title>
  </head>
  <body>
    <h1>🚴🏼‍♀️ Bikewatching</h1>

    <p>
      Bike traffic in Boston, averaged by each hour of the day.
    </p>

    <div id="time-control">
    <label for="time-slider">Time of day:</label>
    <input
        type="range"
        id="time-slider"
        min="-1"
        max="1440"
        value="-1"
        step="1"
    />
    <span id="selected-time">All day</span>
    </div>

    <div id="map"></div>

    <div class="legend">
    <h3>Legend:</h3>

    <div style="--departure-ratio: 1">
        <span>More departures</span>
    </div>

    <div style="--departure-ratio: 0.5">
        <span>Balanced</span>
    </div>

    <div style="--departure-ratio: 0">
        <span>More arrivals</span>
    </div>
    </div>
        
  </body>
</html>
